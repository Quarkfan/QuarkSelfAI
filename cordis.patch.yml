# This bundle contributes only the stable lark-cli capability provider.
# Routing, policy, projections and executor providers are separate plugins.
- id: llm-pi-ai
  config:
    providers:
      blacklake-deepseek:
        displayName: BlackLake DeepSeek
        api: openai-completions
        apiKeyEnv: QUARK_INFERENCE_API_KEY
        baseURL: !!js process.env.QUARK_INFERENCE_BASE_URL
        models:
          - id: deepseek/openai/deepseek-v4-pro
            name: DeepSeek V4 Pro

- id: agent-default-model
  config:
    provider: blacklake-deepseek
    model: deepseek/openai/deepseek-v4-pro

- id: webserver
  config:
    host: 127.0.0.1
    port: !!js Number(process.env.DSH_WEB_PORT || 3211)

- insert:
    - id: feishu-lark-cli
      name: '@quarkfan/quark-self-ai'
      config:
        executable: lark-cli
        identity: bot
        requiredEventKeys:
          - im.message.receive_v1
          - card.action.trigger
          - im.chat.member.user.added_v1
          - im.message.reaction.created_v1
          - im.message.reaction.deleted_v1
    - id: blacklake-reference-router
      name: '@quarkfan/quark-self-ai/blacklake'
      disabled: !!js '!process.env.BLACKLAKE_WORKSPACE_ROOT'
      config:
        workspaceRoot: !!js process.env.BLACKLAKE_WORKSPACE_ROOT
    - id: quark-executor-claude-code-read
      name: '@deepseek-ai/dsh-subagent-claude-code'
      config:
        providerName: quark-claude-code-read
        permissionMode: dontAsk
        # DSH scrubs credential-shaped ambient variables before spawning Claude.
        # Re-introduce only the two supported Anthropic credential names here;
        # endpoint/model variables remain ordinary inherited environment values.
        # --dump-config renders this expression without evaluating the secret.
        env: !!js >-
          Object.assign({}, process.env.ANTHROPIC_API_KEY ? { ANTHROPIC_API_KEY: process.env.ANTHROPIC_API_KEY } : {}, process.env.ANTHROPIC_AUTH_TOKEN ? { ANTHROPIC_AUTH_TOKEN: process.env.ANTHROPIC_AUTH_TOKEN } : {})
    - id: quark-executor-claude-code-write
      name: '@deepseek-ai/dsh-subagent-claude-code'
      config:
        providerName: quark-claude-code-write
        permissionMode: acceptEdits
        env: !!js >-
          Object.assign({}, process.env.ANTHROPIC_API_KEY ? { ANTHROPIC_API_KEY: process.env.ANTHROPIC_API_KEY } : {}, process.env.ANTHROPIC_AUTH_TOKEN ? { ANTHROPIC_AUTH_TOKEN: process.env.ANTHROPIC_AUTH_TOKEN } : {})
    - id: quark-executor-codex-read
      name: '@deepseek-ai/dsh-subagent-codex'
      config:
        providerName: quark-codex-read
        permissionMode: never
    - id: quark-executor-codex-write
      name: '@deepseek-ai/dsh-subagent-codex'
      config:
        providerName: quark-codex-write
        permissionMode: approve-for-me
    - id: quark-executor-router
      name: '@quarkfan/quark-self-ai/executor-router'
      config:
        workspaceRoots: !!js JSON.parse(process.env.ASSISTANT_WORKSPACE_ROOTS || JSON.stringify([process.cwd()]))
        defaultExecutor: claude-code
        providers:
          claude-code: { readOnly: quark-claude-code-read, write: quark-claude-code-write }
          codex: { readOnly: quark-codex-read, write: quark-codex-write }
          dsh-native: { readOnly: spawn, write: spawn }
        routes:
          claude-code: [claude-code, dsh-native, codex]
          codex: [codex]
          dsh-native: [dsh-native]
    - id: quark-durable-state
      name: '@quarkfan/quark-self-ai/durable-state'
      config:
        storageKind: !!js process.env.ASSISTANT_STORAGE === 'postgres' ? 'postgres' : 'sqlite'
        sqlitePath: !!js >-
          process.env.QUARK_SQLITE_PATH || (process.env.SQLITE_PATH ? (process.env.SQLITE_PATH.startsWith('/') ? process.env.SQLITE_PATH : process.cwd() + '/' + process.env.SQLITE_PATH) : process.env.DSH_HOME + '/quarkselfai.sqlite3')
        databaseUrl: !!js process.env.DATABASE_URL
    - id: quark-action-ledger
      name: '@quarkfan/quark-self-ai/action-ledger'
    - id: quark-agent-action-worker
      name: '@quarkfan/quark-self-ai/action-worker'
      # Claims approved durable actions and gives each one an exact DSH parent session.
      disabled: !!js process.env.QUARK_NATIVE_ACTION_WORKER !== 'true'
      config:
        enabled: true
        workerId: !!js process.env.QUARK_ACTION_WORKER_ID || ('action-' + process.pid)
        workspaces: !!js JSON.parse(process.env.ASSISTANT_WORKSPACE_ROOTS || JSON.stringify([process.cwd()]))
        # Ledger commits wake the worker immediately. This is only crash/restart recovery.
        pollIntervalMs: 600000
        leaseMs: 7200000
        retryDelayMs: 120000
        maxAttempts: 5
    - id: quark-durable-workflows
      name: '@quarkfan/quark-self-ai/durable-workflows'
      config:
        workerId: !!js process.env.QUARK_WORKFLOW_WORKER_ID || ('workflow-' + process.pid)
        enabled: true
        # Durable transitions schedule exact wake-ups. This is only crash/restart recovery.
        pollIntervalMs: 600000
        leaseMs: 120000
        retryDelayMs: 120000
        maxAttempts: 5
    - id: quark-durable-events
      name: '@quarkfan/quark-self-ai/durable-events'
      config:
        workerId: !!js process.env.QUARK_EVENT_WORKER_ID || ('event-' + process.pid)
        enabled: true
        # Event writes wake the inbox in-process. This is only crash/restart recovery.
        pollIntervalMs: 600000
        leaseMs: 120000
        retryDelayMs: 120000
        maxAttempts: 5
    - id: quark-dsh-conversation-effects
      name: '@quarkfan/quark-self-ai/dsh-conversation-effects'
      # Creates or resumes user-visible DSH sessions after explicit product activation.
      disabled: !!js process.env.QUARK_NATIVE_CONVERSATION_EFFECTS !== 'true'
      config:
        enabled: true
        titlePrefix: 飞书直办
    - id: quark-feishu-context-effects
      name: '@quarkfan/quark-self-ai/feishu-context-effects'
      # Read-only context loading shares the same explicit intake ownership window.
      disabled: !!js process.env.QUARK_NATIVE_FEISHU_CONTEXT_EFFECTS !== 'true'
      config:
        executable: lark-cli
    - id: quark-feishu-focus-discovery-effects
      name: '@quarkfan/quark-self-ai/feishu-focus-discovery-effects'
      # Read-only low-frequency searches share the explicit intake ownership window.
      disabled: !!js process.env.QUARK_NATIVE_FEISHU_DISCOVERY_EFFECTS !== 'true'
      config:
        executable: lark-cli
        searchPageLimit: 10
        flagPageLimit: 1000
        feedPageLimit: 100
    - id: quark-message-intake
      name: '@quarkfan/quark-self-ai/message-intake'
      # Intake/projection starts only after explicit single-owner activation.
      disabled: !!js process.env.QUARK_NATIVE_MESSAGE_INTAKE !== 'true'
      config:
        enabled: true
        ownerOpenId: !!js process.env.QUARK_OWNER_OPEN_ID || 'not-configured'
        workspace: !!js process.env.QUARK_OWNER_WORKSPACE || '/Users/edy/BlackLakeWork'
        focusSenderIds: []
        focusConversationIds: []
        discoveryIntervalMs: 600000
        discoveryOverlapMs: 120000
        discoveryRetryMs: 600000
        monitorOwnerParticipation: true
        monitorFlaggedConversations: true
        monitorDirectMessages: true
        monitorMentionBackfill: true
        focusFeedGroupNames: [特别关注]
        taskProjection:
          projectId: !!js process.env.DIDA_PROJECT_ID
          authorization:
            id: owner-policy:dida-task-projection:v1
            grantedBy: owner
            grantedAt: '2026-08-20T00:00:00+08:00'
            scope: dida.task-projection
            revision: 1
            source: owner-directive:auto-create-and-maintain-tasks
            projectId: !!js process.env.DIDA_PROJECT_ID
    - id: quark-intake-interaction-effects
      name: '@quarkfan/quark-self-ai/intake-interaction-effects'
      # Card callbacks are consumers too: keep the provider under the same
      # single-owner cutover gate as native message intake.
      disabled: !!js process.env.QUARK_NATIVE_INTERACTION_EFFECTS !== 'true'
      config:
        ownerOpenId: !!js process.env.QUARK_OWNER_OPEN_ID || 'not-configured'
    - id: quark-dsh-reasoning-effects
      name: '@quarkfan/quark-self-ai/dsh-reasoning-effects'
      # Structured policy reasoning is independent from user-visible DSH
      # conversations, but must cut over with the native intake owner.
      disabled: !!js process.env.QUARK_NATIVE_REASONING_EFFECTS !== 'true'
      config:
        enabled: true
        provider: blacklake-deepseek
        model: deepseek/openai/deepseek-v4-pro
        maxTokens: 1500
    - id: quark-dida-task-effects
      name: '@quarkfan/quark-self-ai/dida-task-effects'
      # Adapter preparation. Cleanup is bounded by authorization evidence carried
      # in durable workflow state. Keep disabled until real replay and cutover.
      disabled: !!js process.env.QUARK_NATIVE_DIDA_EFFECTS !== 'true'
      config:
        executable: dida
        projectIds: !!js >-
          [process.env.DIDA_PROJECT_ID, process.env.DIDA_FOLLOWUP_PROJECT_ID].filter(Boolean)
    - id: quark-dida-projection-effects
      name: '@quarkfan/quark-self-ai/dida-projection-effects'
      # Writes only under durable owner evidence carried by each effect. Keep
      # disabled until projection shadow replay and single-owner cutover.
      disabled: !!js process.env.QUARK_NATIVE_DIDA_PROJECTION_EFFECTS !== 'true'
      config:
        executable: dida
        projectIds: !!js >-
          [process.env.DIDA_PROJECT_ID, process.env.DIDA_FOLLOWUP_PROJECT_ID].filter(Boolean)
    - id: quark-dida-maintenance
      name: '@quarkfan/quark-self-ai/dida-maintenance'
      # Definitions are ready, but task-system and notification handlers must activate first.
      disabled: !!js process.env.QUARK_NATIVE_DIDA_MAINTENANCE !== 'true'
      config:
        enabled: true
        projectId: !!js process.env.DIDA_PROJECT_ID
        overdueIntervalMs: 1800000
        overdueRetryMs: 600000
        failureNotifyThreshold: 3
        cleanupTimeZone: Asia/Shanghai
        cleanupHour: 3
        cleanupPollIntervalMs: 21600000
        cleanupFailureNotifyThreshold: 3
        completedRetentionDays: 30
        cleanupMaxPerRun: 50
        cleanupAuthorization:
          id: owner-policy:dida-completed-cleanup:v1
          grantedBy: owner
          grantedAt: '2026-08-20T00:00:00+08:00'
          scope: dida.completed-task-cleanup
          revision: 1
          source: owner-directive:periodically-clean-completed-automation-tasks
          projectId: !!js process.env.DIDA_PROJECT_ID
          minimumRetentionDays: 30
          maximumDeletesPerRun: 50
    - id: quark-codex-session-effects
      name: '@quarkfan/quark-self-ai/codex-session-effects'
      # Read-only inspection plus owner-authorized archive/delete requires explicit activation.
      disabled: !!js >-
        process.env.QUARK_NATIVE_CODEX_SESSION_EFFECTS !== 'true' || !process.env.CODEX_APP_SERVER_SOCKET
      config:
        executable: codex
        appServerSocket: !!js process.env.CODEX_APP_SERVER_SOCKET
        activityTimeoutMs: 5000
        stateDatabase: !!js >-
          process.env.CODEX_STATE_DB || ((process.env.CODEX_HOME || (process.env.HOME + '/.codex')) + '/state_5.sqlite')
        workspace: !!js process.env.QUARK_OWNER_WORKSPACE || '/Users/edy/BlackLakeWork'
    - id: quark-session-lifecycle
      name: '@quarkfan/quark-self-ai/session-lifecycle'
      # Archive/delete effects are irreversible and remain behind explicit activation.
      disabled: !!js process.env.QUARK_NATIVE_SESSION_LIFECYCLE !== 'true'
      config:
        enabled: true
        pollIntervalMs: 21600000
        retryBaseMs: 3600000
        retryMaxMs: 86400000
        deleteAfterDays: 7
        failureNotifyThreshold: 1
        failureNotifyCooldownMs: 86400000
        authorization:
          id: owner-policy:codex-auto-research-session-lifecycle:v1
          grantedBy: owner
          grantedAt: '2026-08-20T00:00:00+08:00'
          scope: codex.auto-research-session-lifecycle
          revision: 1
          source: owner-directive:archive-completed-and-delete-after-one-week
          minimumArchivedDays: 7
    - id: quark-xiaowei-research
      name: '@quarkfan/quark-self-ai/xiaowei-research'
      # Requests require durable owner approval and one Feishu channel owner.
      disabled: !!js process.env.QUARK_NATIVE_XIAOWEI_RESEARCH !== 'true'
      config:
        enabled: true
        agentName: 智造湖小维
        agentOpenId: !!js process.env.XIAOWEI_AGENT_OPEN_ID
        agentChatId: !!js process.env.XIAOWEI_AGENT_CHAT_ID
        retryBaseMs: 120000
        retryMaxMs: 3600000
        failureNotifyThreshold: 3
        taskProjection:
          projectId: !!js process.env.DIDA_PROJECT_ID
          authorization:
            id: owner-policy:dida-task-projection:v1
            grantedBy: owner
            grantedAt: '2026-08-20T00:00:00+08:00'
            scope: dida.task-projection
            revision: 1
            source: owner-directive:auto-create-and-maintain-tasks
            projectId: !!js process.env.DIDA_PROJECT_ID
    - id: quark-followup
      name: '@quarkfan/quark-self-ai/followup'
      # Workday timer, card callback, contact resolution and reply consumption activate together.
      disabled: !!js process.env.QUARK_NATIVE_FOLLOWUP !== 'true'
      config:
        enabled: true
        projectId: !!js process.env.DIDA_FOLLOWUP_PROJECT_ID
        timeZone: Asia/Shanghai
        scheduledHour: 10
        pollIntervalMs: 3600000
        retryBaseMs: 120000
        retryMaxMs: 21600000
        failureNotifyThreshold: 1
        taskProjection:
          projectId: !!js process.env.DIDA_FOLLOWUP_PROJECT_ID
          authorization:
            id: owner-policy:dida-followup-projection:v1
            grantedBy: owner
            grantedAt: '2026-08-20T00:00:00+08:00'
            scope: dida.task-projection
            revision: 1
            source: owner-directive:delegate-followup-task-management
            projectId: !!js process.env.DIDA_FOLLOWUP_PROJECT_ID
    - id: quark-feishu-ingress
      name: '@quarkfan/quark-self-ai/feishu-ingress'
      # Server-side subscriptions start only after explicit single-owner activation.
      disabled: !!js process.env.QUARK_NATIVE_FEISHU_INGRESS !== 'true'
      config:
        startConsumer: true
    - id: quark-feishu-workflow-effects
      name: '@quarkfan/quark-self-ai/feishu-workflow-effects'
      # Contains external writes. Keep absent until the approved maintenance
      # window has transferred notification and outbound-message ownership.
      disabled: !!js process.env.QUARK_NATIVE_FEISHU_EFFECTS !== 'true'
      config:
        executable: lark-cli
        ownerOpenId: !!js process.env.QUARK_OWNER_OPEN_ID || 'not-configured'
    - id: quark-collaboration-learning
      name: '@quarkfan/quark-self-ai/collaboration-learning'
      # Enable only inside the approved state-ownership maintenance window.
      disabled: !!js process.env.QUARK_NATIVE_COLLABORATION_LEARNING !== 'true'
      config:
        enabled: true
        evaluationIntervalMs: 86400000
        dailyBriefEnabled: true
        autoTuneMinimumSamples: 8
        autoTuneConfidence: 0.85
    - id: quark-dynamic-plugin-policy
      name: '@quarkfan/quark-self-ai/dynamic-plugin-policy'
    - id: dsh-tool-cordis
      name: '@deepseek-ai/dsh-tool-cordis'
