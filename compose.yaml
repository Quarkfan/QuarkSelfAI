services:
  assistant:
    build:
      context: .
      args:
        LARK_CLI_VERSION: "1.0.88"
    restart: unless-stopped
    environment:
      ASSISTANT_STORAGE: sqlite
      SQLITE_PATH: /app/var/quarkselfai.sqlite3
      WEB_HOST: 0.0.0.0
      WEB_PORT: 3210
      CONSOLE_TOKEN: ${CONSOLE_TOKEN:?set CONSOLE_TOKEN}
      CONTROL_PLANE_TOKEN: ${CONTROL_PLANE_TOKEN:?set CONTROL_PLANE_TOKEN}
      CONSOLE_SECURE_COOKIE: ${CONSOLE_SECURE_COOKIE:-false}
      LARK_IDENTITY: bot
      DSH_HOME: /app/var/dsh
      DSH_PROFILE: feishu-assistant
      QUARK_APPLICATION_MODE: compatibility
      ASSISTANT_WORKSPACE_ROOTS: '["/app"]'
    ports:
      - "${QUARK_PORT:-3210}:3210"
    volumes:
      - quark_data:/app/var

volumes:
  quark_data:
